<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Angle - AQ Token Version</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: 600; }
    .tab-inactive { color: #6b7280; }
    canvas { touch-action: none; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-5xl mx-auto p-4 md:p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">โปรแกรมวัดมุมสัมผัส (Contact Angle - AQ Token)</h1>
    
    <div class="flex border-b border-gray-300 mb-6">
      <button id="tab-manual" class="px-4 py-2 tab-active focus:outline-none w-1/2 text-center" onclick="switchTab('manual')">
        📍 กำหนดจุดเอง (Manual)
      </button>
      <button id="tab-ai" class="px-4 py-2 tab-inactive focus:outline-none w-1/2 text-center" onclick="switchTab('ai')">
        ✨ ให้ AI วิเคราะห์ (AQ Token)
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <div class="bg-white p-5 rounded-lg shadow-md md:col-span-1 flex flex-col gap-4 h-fit">
        
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">1. อัปโหลดรูปภาพหยดน้ำ</label>
          <input type="file" id="imageInput" accept="image/*" class="block w-full text-sm text-gray-500
            file:mr-4 file:py-2 file:px-4
            file:rounded-md file:border-0
            file:text-sm file:font-semibold
            file:bg-blue-50 file:text-blue-700
            hover:file:bg-blue-100 cursor-pointer border border-gray-300 rounded-md p-1"
          >
        </div>

        <div id="ai-controls" class="hidden flex-col gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">2. เลือกโมเดล</label>
            <select id="modelSelect" class="w-full border border-gray-300 p-2 rounded-md focus:ring focus:ring-blue-200 outline-none">
              <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
              <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">3. ใส่รหัส AQ Token ของคุณ</label>
            <input type="password" id="apiKeyInput" placeholder="วางรหัส AQ... ที่นี่" class="w-full border border-gray-300 p-2 rounded-md focus:ring focus:ring-blue-200 outline-none">
            <p class="text-xs text-gray-500 mt-1">ระบบจะส่งรหัสผ่านระบบตรวจสอบสิทธิ์ที่รองรับ AQ</p>
          </div>

          <button id="analyzeBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition duration-200">
            ✨ ให้ AI วิเคราะห์ภาพ
          </button>
        </div>

        <div id="manual-controls" class="flex flex-col gap-4">
          <div class="bg-blue-50 p-3 rounded-md text-sm text-blue-900 border border-blue-100">
            <p class="font-semibold mb-1">📌 วิธีวัดด้วยมือ (สำรอง 100%):</p>
            <ol class="list-decimal pl-4 space-y-1">
              <li>คลิกจุดตัดยอดหยดน้ำ (<span class="text-red-600 font-bold">จุดที่ 1</span>)</li>
              <li>คลิกแนวเส้นพื้นผิว (<span class="text-blue-600 font-bold">จุดที่ 2</span>)</li>
              <li>คลิกแนวเส้นขอบหยดน้ำ (<span class="text-green-600 font-bold">จุดที่ 3</span>)</li>
            </ol>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">ผลลัพธ์มุมสัมผัส:</label>
            <div id="angleResult" class="text-3xl font-bold text-blue-600 bg-gray-50 p-3 rounded-md text-center border border-gray-200">
              0.00°
            </div>
          </div>
          <button id="resetBtn" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-md transition duration-200">
            🔄 ล้างจุดแล้ววัดใหม่
          </button>
        </div>

        <div id="statusMessage" class="hidden p-3 rounded-md text-sm font-medium"></div>
        
      </div>

      <div class="bg-white p-4 rounded-lg shadow-md md:col-span-2 min-h-[350px] flex items-center justify-center relative overflow-hidden">
        <p id="placeholderText" class="text-gray-400">อัปโหลดรูปภาพเพื่อเริ่มต้น</p>
        <canvas id="imageCanvas" class="hidden absolute max-w-full max-h-full cursor-crosshair"></canvas>
      </div>

    </div>
    
    <div id="aiResultContainer" class="hidden mt-6 bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500">
      <h2 class="text-lg font-bold text-gray-800 mb-3">ผลการวิเคราะห์จาก AI:</h2>
      <div id="aiResultText" class="text-gray-700 whitespace-pre-wrap leading-relaxed"></div>
    </div>

  </div>

  <script>
    let currentMode = 'manual';
    const imageInput = document.getElementById('imageInput');
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    const placeholderText = document.getElementById('placeholderText');
    const statusMessage = document.getElementById('statusMessage');
    
    let currentImage = null;
    let base64Image = null;
    let mimeType = 'image/jpeg';
    let points = []; 
    const scaleRef = { ratio: 1 }; 

    document.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('aq_token_key');
      if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
    });

    function switchTab(mode) {
      currentMode = mode;
      const tabManual = document.getElementById('tab-manual');
      const tabAi = document.getElementById('tab-ai');
      
      if (mode === 'manual') {
        tabManual.className = "px-4 py-2 tab-active focus:outline-none w-1/2 text-center";
        tabAi.className = "px-4 py-2 tab-inactive focus:outline-none w-1/2 text-center";
        document.getElementById('manual-controls').classList.remove('hidden');
        document.getElementById('manual-controls').classList.add('flex');
        document.getElementById('ai-controls').classList.add('hidden');
        document.getElementById('ai-controls').classList.remove('flex');
        document.getElementById('aiResultContainer').classList.add('hidden');
        hideStatus();
        redrawCanvas();
      } else {
        tabAi.className = "px-4 py-2 tab-active focus:outline-none w-1/2 text-center";
        tabManual.className = "px-4 py-2 tab-inactive focus:outline-none w-1/2 text-center";
        document.getElementById('ai-controls').classList.remove('hidden');
        document.getElementById('ai-controls').classList.add('flex');
        document.getElementById('manual-controls').classList.add('hidden');
        document.getElementById('manual-controls').classList.remove('flex');
        hideStatus();
        redrawCanvas();
      }
    }

    imageInput.addEventListener('click', function() { this.value = null; });

    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      mimeType = file.type || 'image/jpeg';
      const reader = new FileReader();
      reader.onload = function(event) {
        const fullBase64 = event.target.result;
        base64Image = fullBase64.split(',')[1];
        
        const img = new Image();
        img.onload = function() {
          currentImage = img;
          placeholderText.classList.add('hidden');
          canvas.classList.remove('hidden');
          
          canvas.width = img.width;
          canvas.height = img.height;
          
          points = [];
          updateAngleDisplay("0.00°");
          hideStatus();
          document.getElementById('aiResultContainer').classList.add('hidden');
          redrawCanvas();
        };
        img.src = fullBase64;
      };
      reader.readAsDataURL(file);
    });

    function redrawCanvas() {
      if (!currentImage) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);

      if (currentMode === 'ai') return; 

      const rect = canvas.getBoundingClientRect();
      scaleRef.ratioX = canvas.width / rect.width;
      scaleRef.ratioY = canvas.height / rect.height;

      points.forEach((p, index) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6 * scaleRef.ratioX, 0, 2 * Math.PI);
        ctx.fillStyle = index === 0 ? 'red' : index === 1 ? 'blue' : 'green';
        ctx.fill();
        ctx.lineWidth = 2 * scaleRef.ratioX;
        ctx.strokeStyle = 'white';
        ctx.stroke();
      });

      if (points.length >= 2) {
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        ctx.lineTo(points[1].x, points[1].y);
        ctx.strokeStyle = 'blue';
        ctx.lineWidth = 3 * scaleRef.ratioX;
        ctx.stroke();
      }
      if (points.length === 3) {
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        ctx.lineTo(points[2].x, points[2].y);
        ctx.strokeStyle = 'green';
        ctx.lineWidth = 3 * scaleRef.ratioX;
        ctx.stroke();
      }
    }

    canvas.addEventListener('pointerdown', function(e) {
      if (currentMode !== 'manual' || !currentImage) return;
      if (points.length >= 3) return;

      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * scaleRef.ratioX;
      const clickY = (e.clientY - rect.top) * scaleRef.ratioY;

      points.push({ x: clickX, y: clickY });
      redrawCanvas();

      if (points.length === 3) {
        calculateAngle();
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      points = [];
      updateAngleDisplay("0.00°");
      redrawCanvas();
    });

    function calculateAngle() {
      const p1 = points[0]; 
      const p2 = points[1]; 
      const p3 = points[2]; 

      const angle1 = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      const angle2 = Math.atan2(p3.y - p1.y, p3.x - p1.x);
      
      let angle = (angle2 - angle1) * (180 / Math.PI);
      angle = Math.abs(angle);
      if (angle > 180) angle = 360 - angle;

      updateAngleDisplay(`${angle.toFixed(2)}°`);
    }

    function updateAngleDisplay(text) {
      document.getElementById('angleResult').textContent = text;
    }

    window.addEventListener('resize', redrawCanvas);

    document.getElementById('analyzeBtn').addEventListener('click', async () => {
      if (!base64Image) {
        showStatus('กรุณาอัปโหลดรูปภาพก่อน', 'error');
        return;
      }

      const token = document.getElementById('apiKeyInput').value.trim();
      if (!token) {
        showStatus('กรุณาใส่รหัส AQ Token', 'error');
        return;
      }
      
      localStorage.setItem('aq_token_key', token);
      const modelName = document.getElementById('modelSelect').value;
      const analyzeBtn = document.getElementById('analyzeBtn');
      
      analyzeBtn.disabled = true;
      analyzeBtn.innerHTML = '⏳ กำลังวิเคราะห์ผ่าน AQ Token...';
      document.getElementById('aiResultContainer').classList.add('hidden');
      hideStatus();

      try {
        // ส่ง Token ในรูปแบบ Bearer Authorization Header ซึ่งรองรับรหัสประเภท AQ
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: "You are an expert in surface chemistry and civil engineering. Estimate the contact angle of the water droplet in this image in degrees. Explain if the surface is hydrophilic or hydrophobic based on the angle. Provide a concise answer in Thai." },
                { inline_data: { mime_type: mimeType, data: base64Image } }
              ]
            }]
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || `HTTP ${response.status}`);
        }

        const resultText = data.candidates[0].content.parts[0].text;
        const formattedText = resultText.replace(/\*\*(.*?)\*\*/g, '<strong class="text-gray-900">$1</strong>');
        
        document.getElementById('aiResultText').innerHTML = formattedText;
        document.getElementById('aiResultContainer').classList.remove('hidden');
        showStatus('วิเคราะห์สำเร็จ!', 'success');

      } catch (error) {
        console.error(error);
        showStatus(`ข้อผิดพลาด: ${error.message}`, 'error');
      } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.innerHTML = '✨ ให้ AI วิเคราะห์ภาพ';
      }
    });

    function showStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
      if (type === 'error') {
        statusMessage.classList.add('bg-red-100', 'text-red-700');
      } else {
        statusMessage.classList.add('bg-green-100', 'text-green-700');
      }
    }

    function hideStatus() {
      statusMessage.classList.add('hidden');
    }
  </script>
</body>
</html>
