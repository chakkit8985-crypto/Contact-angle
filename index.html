                        Gemini 1.5 Flash

                        GPT‑4o

<script>

let base64Image = null;

let mimeType =
'image/jpeg';

let currentImage = null;

const imageInput =
document.getElementById(
'imageInput'
);

const canvas =
document.getElementById(
'imageCanvas'
);

const ctx =
canvas.getContext('2d');

const placeholderText =
document.getElementById(
'placeholderText'
);

document
.addEventListener(
'DOMContentLoaded',
()=>{

const savedKey =
localStorage.getItem(
'contact_angle_key'
);

if(savedKey){

document
.getElementById(
'apiKeyInput'
)
.value = savedKey;

}

});
function showStatus(
message,
type="success"
){

const el =
document.getElementById(
"statusMessage"
);

el.textContent =
message;

el.classList.remove(
"hidden",
"bg-red-100",
"text-red-700",
"bg-green-100",
"text-green-700"
);

if(type==="error"){

el.classList.add(
"bg-red-100",
"text-red-700"
);

}else{

el.classList.add(
"bg-green-100",
"text-green-700"
);

}

}

function hideStatus(){

document
.getElementById(
"statusMessage"
)
.classList.add(
"hidden"
);

}

function classifySurface(
angle
){

if(angle<10){

return "Superhydrophilic";

}

if(angle<90){

return "Hydrophilic";

}

if(angle<150){

return "Hydrophobic";

}

return "Superhydrophobic";

}

imageInput.addEventListener(
"click",
function(){

this.value = null;

}
);

imageInput.addEventListener(
"change",
function(e){

const file =
e.target.files[0];

if(!file){

return;

}

mimeType =
file.type ||
"image/jpeg";

const reader =
new FileReader();

reader.onload =
function(event){

const fullBase64 =
event.target.result;

base64Image =
fullBase64.split(",")[1];

const img =
new Image();

img.onload =
function(){

currentImage =
img;

canvas.width =
img.width;

canvas.height =
img.height;

canvas.classList.remove(
"hidden"
);

placeholderText.classList.add(
"hidden"
);

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.drawImage(
img,
0,
0
);

hideStatus();

};

img.src =
fullBase64;

};

reader.readAsDataURL(
file
);

}
);

document
.getElementById(
"clearBtn"
)
.addEventListener(
"click",
()=>{

base64Image =
null;

currentImage =
null;

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

canvas.classList.add(
"hidden"
);

placeholderText.classList.remove(
"hidden"
);

document
.getElementById(
"aiResultContainer"
)
.classList.add(
"hidden"
);

hideStatus();

}
);

function getPrompt(){

return `
You are an expert in:

- Surface Chemistry
- Contact Angle Analysis
- Wetting Theory
- ASTM Contact Angle Evaluation

Analyze this droplet image.

Estimate:

1. Contact angle in degree
2. Confidence score
3. Surface type
4. Short explanation

Return only valid JSON.

{
  "contact_angle": 0,
  "confidence": 0,
  "surface_type": "",
  "explanation": ""
}
`;

}

async function callGemini(
model,
key
){

const response =
await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

contents:[
{

parts:[

{
text:getPrompt()
},

{
inline_data:{
mime_type:mimeType,
data:base64Image
}
}

]

}

]

})

}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data?.error?.message ||
"Gemini Error"
);

}

return data
?.candidates?.[0]
?.content?.parts?.[0]
?.text;

}

async function callOpenAI(
model,
key
){

const response =
await fetch(
"https://api.openai.com/v1/chat/completions",
{

method:"POST",

headers:{

Authorization:
`Bearer ${key}`,

"Content-Type":
"application/json"

},

body:JSON.stringify({

model:model,

messages:[

{

role:"user",

content:[

{
type:"text",
text:getPrompt()
},

{
type:"image_url",

image_url:{

url:
`data:${mimeType};base64,${base64Image}`

}

}

]

}

],

temperature:0

})

}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data?.error?.message ||
"OpenAI Error"
);

}

return data
?.choices?.[0]
?.message?.content;

}

async function analyzeImage(){

const provider =
document
.getElementById(
"providerSelect"
)
.value;

const model =
document
.getElementById(
"modelSelect"
)
.value;

const apiKey =
document
.getElementById(
"apiKeyInput"
)
.value
.trim();

if(!base64Image){

showStatus(
"กรุณาอัปโหลดรูปภาพ",
"error"
);

return;

}

if(!apiKey){

showStatus(
"กรุณาใส่ API Key",
"error"
);

return;

}

localStorage.setItem(
"contact_angle_key",
apiKey
);

const btn =
document
.getElementById(
"analyzeBtn"
);

btn.disabled = true;

btn.innerHTML =
"⏳ กำลังวิเคราะห์...";

hideStatus();

let resultText = "";

try{

if(provider==="gemini"){

resultText =
await callGemini(
model,
apiKey
);

}

else if(
provider==="openai"
){

resultText =
await callOpenAI(
model,
apiKey
);

}

else if(
provider==="openrouter"
){

resultText =
await callOpenRouter(
model,
apiKey
);

}
