<script>
let canvas =
document.getElementById(
"canvas"
);

let ctx =
canvas.getContext(
"2d"
);

let currentImage =
null;

let lastResult =
null;

document
.getElementById(
"imageInput"
)
.addEventListener(
"change",
function(e){

const file =
e.target.files[0];

if(!file)
return;

const reader =
new FileReader();

reader.onload =
function(event){

const img =
new Image();

img.onload =
function(){

currentImage =
img;

canvas.width =
img.width;

canvas.height =
img.height;

ctx.drawImage(
img,
0,
0
);

};

img.src =
event.target.result;

};

reader.readAsDataURL(
file
);

}
);

function classify(
angle
){

if(angle<10)
return
"Superhydrophilic";

if(angle<90)
return
"Hydrophilic";

if(angle<150)
return
"Hydrophobic";

return
"Superhydrophobic";

}
function findDropletContour(){

if(
typeof cv ===
"undefined"
){

alert(
"OpenCV ยังโหลดไม่เสร็จ"
);

return null;

}

if(
currentImage===null
){

alert(
"กรุณาอัปโหลดรูปภาพ"
);

return null;

}

let src =
cv.imread(
canvas
);

let gray =
new cv.Mat();

cv.cvtColor(
src,
gray,
cv.COLOR_RGBA2GRAY
);

let blur =
new cv.Mat();

cv.GaussianBlur(
gray,
blur,
new cv.Size(
5,
5
),
0
);

let thresh =
new cv.Mat();

cv.threshold(
blur,
thresh,
0,
255,
cv.THRESH_BINARY_INV +
cv.THRESH_OTSU
);

let contours =
new cv.MatVector();

let hierarchy =
new cv.Mat();

cv.findContours(
thresh,
contours,
hierarchy,
cv.RETR_EXTERNAL,
cv.CHAIN_APPROX_NONE
);

let maxArea = 0;

let largestContour =
null;

for(
let i=0;
i<contours.size();
i++
){

let contour =
contours.get(i);

let area =
cv.contourArea(
contour
);

if(
area > maxArea
){

maxArea =
area;

largestContour =
contour;

}

}

if(
largestContour===null
){

alert(
"ไม่พบหยดน้ำ"
);

src.delete();
gray.delete();
blur.delete();
thresh.delete();
contours.delete();
hierarchy.delete();

return null;

}

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.drawImage(
currentImage,
0,
0
);

ctx.strokeStyle =
"red";

ctx.lineWidth =
2;

let data =
largestContour.data32S;

for(
let i=0;
i<data.length;
i+=2
){

const x =
data[i];

const y =
data[i+1];

if(i===0){

ctx.beginPath();

ctx.moveTo(
x,
y
);

}else{

ctx.lineTo(
x,
y
);

}

}

ctx.closePath();

ctx.stroke();

gray.delete();
blur.delete();
thresh.delete();
contours.delete();
hierarchy.delete();

return {

src,
contour:
largestContour

};

}
document
.getElementById(
"measureBtn"
)
.addEventListener(
"click",
()=>{

const fit =
fitDropletEllipse();

if(fit){

console.log(
"Ellipse fitted"
);

}

});
function detectBaseline(
contour
){

const points =
contour.data32S;

let maxY = 0;

for(
let i=1;
i<points.length;
i+=2
){

if(
points[i] > maxY
){

maxY =
points[i];

}

}

return maxY;

}
function detectContactPoints(
contour,
baselineY
){

const points =
contour.data32S;

let leftPoint =
null;

let rightPoint =
null;

const tolerance =
5;

for(
let i=0;
i<points.length;
i+=2
){

const x =
points[i];

const y =
points[i+1];

if(
Math.abs(
y-baselineY
)
<
tolerance
){

if(
leftPoint===null ||
x < leftPoint.x
){

leftPoint = {

x:x,
y:y

};

}

if(
rightPoint===null ||
x > rightPoint.x
){

rightPoint = {

x:x,
y:y

};

}

}

}

return {

left:leftPoint,

right:rightPoint

};

}

function fitDropletEllipse(){
const baselineY =
detectBaseline(
contour
);

const contacts =
detectContactPoints(
contour,
baselineY
);
ctx.strokeStyle =
"orange";

ctx.lineWidth =
2;

ctx.beginPath();

ctx.moveTo(
0,
baselineY
);

ctx.lineTo(
canvas.width,
baselineY
);

ctx.stroke();

return {

centerX,
centerY,

majorAxis,
minorAxis,

radius,

baselineY,

leftContact:
contacts.left,

rightContact:
contacts.right,

ellipse,
contour

};


function drawTangent(
point,
slope
){

const length =
60;

const dx =
length /
Math.sqrt(
1 +
slope*slope
);

const dy =
slope * dx;

ctx.beginPath();

ctx.moveTo(
point.x-dx,
point.y-dy
);

ctx.lineTo(
point.x+dx,
point.y+dy
);

ctx.stroke();

}

function calculateContactAngle(){

   const fit =
   fitDropletEllipse();

   ...

}

function calculateContactAngle(){

const fit =
fitDropletEllipse();

if(!fit){

return;

}

const ellipse =
fit.ellipse;

const centerX =
fit.centerX;

const centerY =
fit.centerY;

const a =
ellipse.size.width/2;

const b =
ellipse.size.height/2;

const angleRad =
ellipse.angle *
Math.PI /
180;

const leftContact =
fit.leftContact;

const rightContact =
fit.rightContact;

if(
!leftContact ||
!rightContact
){

alert(
"ไม่พบ Contact Point"
);

return;

}


ctx.fillStyle =
"blue";

ctx.beginPath();

ctx.arc(
leftContact.x,
leftContact.y,
6,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
rightContact.x,
rightContact.y,
6,
0,
Math.PI*2
);

ctx.fill();

const leftFit =
estimateContourTangent(
fit.contour,
leftContact
);

const rightFit =
estimateContourTangent(
fit.contour,
rightContact
);

const leftSlope =
leftFit.slope;

const rightSlope =
rightFit.slope;


const leftAngle =
let leftAngle =
Math.atan(
leftSlope
)
*
180/
Math.PI;

let rightAngle =
Math.atan(
rightSlope
)
*
180/
Math.PI;

leftAngle =
Math.abs(
leftAngle
);

rightAngle =
Math.abs(
rightAngle
);

if(
leftAngle > 90
){

leftAngle =
180-leftAngle;

}

if(
rightAngle > 90
){

rightAngle =
180-rightAngle;

}


const averageAngle =

(
leftAngle+
rightAngle
)/2;

ctx.strokeStyle =
"cyan";

ctx.lineWidth =
2;

drawTangent(
leftContact,
leftSlope
);

drawTangent(
rightContact,
rightSlope
);

document
.getElementById(
"leftAngle"
)
.innerHTML =
leftAngle
.toFixed(1)
+"°";

document
.getElementById(
"rightAngle"
)
.innerHTML =
rightAngle
.toFixed(1)
+"°";

document
.getElementById(
"avgAngle"
)
.innerHTML =
averageAngle
.toFixed(1)
+"°";

document
.getElementById(
"surfaceText"
)
.innerHTML =
classify(
averageAngle
);

lastResult = {

left:
leftAngle,

right:
rightAngle,

average:
averageAngle

};

}

function estimateContourTangent(
contour,
contactPoint
){

const points =
contour.data32S;

let nearestIndex = -1;
let minDistance =
Infinity;

for(
let i=0;
i<points.length;
i+=2
){

const x =
points[i];

const y =
points[i+1];

const d =
Math.hypot(
x-contactPoint.x,
y-contactPoint.y
);

if(
d < minDistance
){

minDistance = d;
nearestIndex = i;

}

}

const step = 20;

let prev =
Math.max(
0,
nearestIndex-step
);

let next =
Math.min(
points.length-2,
nearestIndex+step
);

const x1 =
points[prev];

const y1 =
points[prev+1];

const x2 =
points[next];

const y2 =
points[next+1];

const slope =
(y2-y1) /
((x2-x1)+0.0001);

return {

slope,
x1,
y1,
x2,
y2

};

}
