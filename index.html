<script>

let canvas =
document.getElementById("canvas");

let ctx =
canvas.getContext("2d");

let currentImage = null;
let lastResult = null;

/* ======================
UPLOAD IMAGE
====================== */

document
.getElementById("imageInput")
.addEventListener("change", e=>{

const file =
e.target.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload = ev=>{

const img =
new Image();

img.onload = ()=>{

currentImage =
img;

canvas.width =
img.width;

canvas.height =
img.height;

ctx.clearRect(
0,0,
canvas.width,
canvas.height
);

ctx.drawImage(
img,
0,
0
);

};

img.src =
ev.target.result;

};

reader.readAsDataURL(file);

});

/* ======================
CLASSIFICATION
====================== */

function classify(angle){

if(angle<10)
return "Superhydrophilic";

if(angle<90)
return "Hydrophilic";

if(angle<150)
return "Hydrophobic";

return "Superhydrophobic";

}

/* ======================
CONTOUR DETECTION
====================== */

function getLargestContour(){

if(typeof cv==="undefined"){

alert(
"OpenCV ยังโหลดไม่เสร็จ"
);

return null;

}

if(!currentImage){

alert(
"กรุณาอัปโหลดภาพ"
);

return null;

}

let src =
cv.imread(canvas);

let gray =
new cv.Mat();

cv.cvtColor(
src,
gray,
cv.COLOR_RGBA2GRAY
);

let blur =
new cv.Mat();

cv.GaussianBlur(
gray,
blur,
new cv.Size(5,5),
0
);

let thresh =
new cv.Mat();

cv.threshold(
blur,
thresh,
0,
255,
cv.THRESH_BINARY_INV+
cv.THRESH_OTSU
);

let contours =
new cv.MatVector();

let hierarchy =
new cv.Mat();

cv.findContours(
thresh,
contours,
hierarchy,
cv.RETR_EXTERNAL,
cv.CHAIN_APPROX_NONE
);

let largest =
null;
let maxArea = 0;

for(
let i=0;
i<contours.size();
i++
){

let c =
contours.get(i);

let area =
cv.contourArea(c);

if(area>maxArea){

maxArea =
area;

largest =
c;

}

}

gray.delete();
blur.delete();
thresh.delete();
hierarchy.delete();

src.delete();

if(!largest){

return null;

}

return largest;

}

/* ======================
CONTACT POINTS
====================== */

function findBaseline(contour){

const pts =
contour.data32S;

let maxY = 0;

for(
let i=1;
i<pts.length;
i+=2
){

if(
pts[i] > maxY
){

maxY =
pts[i];

}

}

return maxY;

}

function getContactPoints(
contour,
baseline
){

const pts =
contour.data32S;

let left=null;
let right=null;

for(
let i=0;
i<pts.length;
i+=2
){

const x =
pts[i];

const y =
pts[i+1];

if(
Math.abs(
y-baseline
)<5
){

if(
left===null ||
x<left.x
){

left={
x:x,
y:y
};

}

if(
right===null ||
x>right.x
){

right={
x:x,
y:y
};

}

}

}

return {
left,
right
};

}

/* ======================
TANGENT
====================== */

function contourSlope(
contour,
point
){

const pts =
contour.data32S;

let nearest=0;
let minDist=1e9;

for(
let i=0;
i<pts.length;
i+=2
){

const x=
pts[i];

const y=
pts[i+1];

const d=
Math.hypot(
x-point.x,
y-point.y
);

if(
d<minDist
){

minDist=d;
nearest=i;

}

}

const step=20;

const p1=
Math.max(
0,
nearest-step
);

const p2=
Math.min(
pts.length-2,
nearest+step
);

const x1=
pts[p1];

const y1=
pts[p1+1];

const x2=
pts[p2];

const y2=
pts[p2+1];

ctx.strokeStyle =
"cyan";

ctx.beginPath();

ctx.moveTo(
x1,
y1
);

ctx.lineTo(
x2,
y2
);

ctx.stroke();

return (
(y2-y1)
/(
(x2-x1)+0.0001
)
);

}

/* ======================
MEASURE
====================== */

function measure(){

const contour =
getLargestContour();

if(!contour){

alert(
"ไม่พบหยดน้ำ"
);

return;

}

ctx.clearRect(
0,0,
canvas.width,
canvas.height
);

ctx.drawImage(
currentImage,
0,
0
);

const ellipse =
cv.fitEllipse(
contour
);

ctx.strokeStyle =
"lime";

ctx.lineWidth = 3;

ctx.beginPath();

ctx.ellipse(
ellipse.center.x,
ellipse.center.y,
ellipse.size.width/2,
ellipse.size.height/2,
ellipse.angle *
Math.PI/180,
0,
Math.PI*2
);

ctx.stroke();

const baseline =
findBaseline(
contour
);

ctx.strokeStyle =
"orange";

ctx.beginPath();

ctx.moveTo(
0,
baseline
);

ctx.lineTo(
canvas.width,
baseline
);

ctx.stroke();

const contacts =
getContactPoints(
contour,
baseline
);

if(
!contacts.left ||
!contacts.right
){

alert(
"ไม่พบ Contact Point"
);

return;

}

ctx.fillStyle =
"blue";

ctx.beginPath();

ctx.arc(
contacts.left.x,
contacts.left.y,
6,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
contacts.right.x,
contacts.right.y,
6,
0,
Math.PI*2
);

ctx.fill();

const leftSlope=
contourSlope(
contour,
contacts.left
);

const rightSlope=
contourSlope(
contour,
contacts.right
);

let leftAngle =
Math.abs(
Math.atan(
leftSlope
)
*180/
Math.PI
);

let rightAngle =
Math.abs(
Math.atan(
rightSlope
)
*180/
Math.PI
);

if(leftAngle>90)
leftAngle=
180-leftAngle;

if(rightAngle>90)
rightAngle=
180-rightAngle;

const avg =
(
leftAngle+
rightAngle
)/2;

document
.getElementById(
"leftAngle"
)
.innerHTML=
leftAngle.toFixed(1)
+"°";

document
.getElementById(
"rightAngle"
)
.innerHTML=
rightAngle.toFixed(1)
+"°";

document
.getElementById(
"avgAngle"
)
.innerHTML=
avg.toFixed(1)
+"°";

document
.getElementById(
"surfaceText"
)
.innerHTML=
classify(avg);

lastResult={
left:leftAngle,
right:rightAngle,
average:avg
};

}

/* ======================
CSV EXPORT
====================== */

function exportCSV(){

if(!lastResult){

alert(
"ยังไม่มีผล"
);

return;

}

const csv=

`Left,Right,Average,Surface
${lastResult.left},
${lastResult.right},
${lastResult.average},
${classify(lastResult.average)}
`;

const blob=
new Blob(
[csv],
{
type:
"text/csv"
}
);

const url=
URL.createObjectURL(
blob
);

const a=
document.createElement(
"a"
);

a.href=url;

a.download=
"contact_angle.csv";

a.click();

URL.revokeObjectURL(
url
);

}

/* ======================
PNG EXPORT
====================== */

function exportPNG(){

const link=
document.createElement(
"a"
);

link.download=
"contact_angle.png";

link.href=
canvas.toDataURL(
"image/png"
);

link.click();

}

/* ======================
BUTTONS
====================== */

document
.getElementById(
"measureBtn"
)
.addEventListener(
"click",
measure
);

document
.getElementById(
"exportCsvBtn"
)
.addEventListener(
"click",
exportCSV
);

document
.getElementById(
"exportPngBtn"
)
.addEventListener(
"click",
exportPNG
);

</script>
