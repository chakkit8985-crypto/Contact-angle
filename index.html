<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Contact Angle Analyzer
</title>

<link rel="manifest"
href="manifest.json">

<script src="https://cdn.tailwindcss.com">
</script>

<script async
src="https://docs.opencv.org/4.x/opencv.js">
</script>

<style>

body{
background:#f3f4f6;
}

.card{
background:white;
border-radius:16px;
padding:20px;
box-shadow:
0 4px 12px rgba(
0,0,0,.08
);
}

canvas{
max-width:100%;
border:1px solid #ddd;
border-radius:12px;
}

</style>

</head>

<body>

<div
class="max-w-6xl mx-auto p-4">

<h1
class="
text-3xl
font-bold
text-center
mb-2">

Contact Angle
Analyzer Pro

</h1>

<p
class="
text-center
text-gray-500
mb-6">

OpenCV Contact Angle
Measurement

</p>

<div
class="
grid
lg:grid-cols-3
gap-6">

<div
class="card">

<label
class="
block
font-semibold
mb-2">

Upload Image

</label>

<input
type="file"
id="imageInput"
accept="image/*"
class="
w-full
border
p-2
rounded">

<button
id="measureBtn"
class="
w-full
mt-4
bg-blue-600
text-white
p-3
rounded">

📐 Measure Contact Angle

</button>

<div
id="statusBox"
class="
hidden
mt-4
p-3
rounded">

</div>

</div>

<div
class="
card
lg:col-span-2">

<div
class="
flex
justify-center">

<canvas
id="imageCanvas">
</canvas>

</div>

</div>

</div>

<div
id="resultBox"
class="
card
mt-6
hidden">

<h2
class="
text-xl
font-bold
mb-4">

Result

</h2>

<div
class="
grid
md:grid-cols-3
gap-4">

<div
class="
bg-blue-50
p-4
rounded">

<div>
Angle
</div>

<div
id="angleResult"
class="
text-4xl
font-bold">

--

</div>

</div>

<div
class="
bg-green-50
p-4
rounded">

<div>
Surface
</div>

<div
id="surfaceResult"
class="
text-xl
font-bold">

--

</div>

</div>

<div
class="
bg-yellow-50
p-4
rounded">

<div>
Method
</div>

<div
id="methodResult"
class="
text-xl
font-bold">

OpenCV

</div>

</div>

</div>

<div
id="detailResult"
class="
mt-4">

</div>

</div>

<script>

let currentImage=null;

let canvas=
document.getElementById(
"imageCanvas"
);

let ctx=
canvas.getContext(
"2d"
);

let imageInput=
document.getElementById(
"imageInput"
);

function showStatus(
msg,
error=false
){

const box=
document.getElementById(
"statusBox"
);

box.classList.remove(
"hidden"
);

box.className=
error
?
"mt-4 p-3 rounded bg-red-100 text-red-700"
:
"mt-4 p-3 rounded bg-green-100 text-green-700";

box.innerHTML=
msg;

}

function classifySurface(
angle
){

if(angle<10)
return
"Superhydrophilic";

if(angle<90)
return
"Hydrophilic";

if(angle<150)
return
"Hydrophobic";

return
"Superhydrophobic";

}

imageInput
.addEventListener(
"change",
function(e){

const file=
e.target.files[0];

if(!file)
return;

const reader=
new FileReader();

reader.onload=
function(event){

const img=
new Image();

img.onload=
function(){

currentImage=
img;

canvas.width=
img.width;

canvas.height=
img.height;

ctx.drawImage(
img,
0,
0
);

};

img.src=
event.target.result;

};

reader.readAsDataURL(
file
);

});

async function detectDroplet(){

if(
typeof cv === "undefined"
){

showStatus(
"OpenCV ยังโหลดไม่เสร็จ",
true
);

return null;

}

if(!currentImage){

showStatus(
"กรุณาอัปโหลดรูปภาพ",
true
);

return null;

}

try{

let src=
cv.imread(
canvas
);

let gray=
new cv.Mat();

cv.cvtColor(
src,
gray,
cv.COLOR_RGBA2GRAY
);

let blur=
new cv.Mat();

cv.GaussianBlur(
gray,
blur,
new cv.Size(
5,
5
),
0
);

let thresh=
new cv.Mat();

cv.threshold(
blur,
thresh,
0,
255,
cv.THRESH_BINARY_INV +
cv.THRESH_OTSU
);

let contours=
new cv.MatVector();

let hierarchy=
new cv.Mat();

cv.findContours(
thresh,
contours,
hierarchy,
cv.RETR_EXTERNAL,
cv.CHAIN_APPROX_SIMPLE
);

let largestArea=0;
let largestContour=null;

for(
let i=0;
i<contours.size();
i++
){

let c=
contours.get(i);

let area=
cv.contourArea(c);

if(
area >
largestArea
){

largestArea=
area;

largestContour=
c;

}

}

if(
largestContour===null
){

throw new Error(
"ไม่พบหยดน้ำ"
);

}

let rect=
cv.boundingRect(
largestContour
);

ctx.strokeStyle=
"#ef4444";

ctx.lineWidth=3;

ctx.strokeRect(
rect.x,
rect.y,
rect.width,
rect.height
);

let topPoint={
x:
rect.x +
(rect.width/2),
y:
rect.y
};

let leftPoint={
x:rect.x,
y:
rect.y +
rect.height
};

let rightPoint={
x:
rect.x +
rect.width,
y:
rect.y +
rect.height
};

ctx.fillStyle=
"red";

ctx.beginPath();

ctx.arc(
topPoint.x,
topPoint.y,
6,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle=
"blue";

ctx.beginPath();

ctx.arc(
leftPoint.x,
leftPoint.y,
6,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
rightPoint.x,
rightPoint.y,
6,
0,
Math.PI*2
);

ctx.fill();

src.delete();
gray.delete();
blur.delete();
thresh.delete();
hierarchy.delete();
contours.delete();

return {

rect,
topPoint,
leftPoint,
rightPoint

};

}
catch(error){

console.error(
error
);

showStatus(
error.message,
true
);

return null;

}

}

function drawGuideLine(
p1,
p2,
color="#22c55e"
){

ctx.beginPath();

ctx.moveTo(
p1.x,
p1.y
);

ctx.lineTo(
p2.x,
p2.y
);

ctx.strokeStyle=
color;

ctx.lineWidth=
2;

ctx.stroke();

}

function estimateRadius(
rect
){

return
Math.max(
rect.width,
rect.height
)/2;

}

function calculateTangentAngle(
contactPoint,
centerPoint
){

const dx=
contactPoint.x-
centerPoint.x;

const dy=
contactPoint.y-
centerPoint.y;

let normal=
Math.atan2(
dy,
dx
);

let tangent=
normal+
(Math.PI/2);

let degree=
tangent*
180/
Math.PI;

degree=
Math.abs(
degree
);

degree=
degree%180;

if(
degree>90
){

degree=
180-degree;

}

return degree;

}
async function measureContactAngle(){

const result=
await detectDroplet();

if(!result){

return;

}

const rect=
result.rect;

const top=
result.topPoint;

const left=
result.leftPoint;

const right=
result.rightPoint;

const center={
x:
rect.x +
(rect.width/2),

y:
rect.y +
(rect.height/2)
};

drawGuideLine(
center,
left
);

drawGuideLine(
center,
right
);

const leftAngle=
calculateTangentAngle(
left,
center
);

const rightAngle=
calculateTangentAngle(
right,
center
);

const averageAngle=
(
leftAngle+
rightAngle
)/2;

document
.getElementById(
"angleResult"
)
.innerHTML=
averageAngle.toFixed(1)
+"°";

document
.getElementById(
"surfaceResult"
)
.innerHTML=
classifySurface(
averageAngle
);

document
.getElementById(
"methodResult"
)
.innerHTML=
"OpenCV";

document
.getElementById(
"detailResult"
)
.innerHTML=
`
<div class="space-y-2">

<div>
Left Angle :
<b>
${leftAngle.toFixed(1)}°
</b>
</div>

<div>
Right Angle :
<b>
${rightAngle.toFixed(1)}°
</b>
</div>

<div>
Average :
<b>
${averageAngle.toFixed(1)}°
</b>
</div>

<div>
Contour Width :
<b>
${rect.width}px
</b>
</div>

<div>
Contour Height :
<b>
${rect.height}px
</b>
</div>

</div>
`;

document
.getElementById(
"resultBox"
)
.classList.remove(
"hidden"
);

showStatus(
"วิเคราะห์สำเร็จ"
);

}

document
.getElementById(
"measureBtn"
)
.addEventListener(
"click",
measureContactAngle
);

if(
"serviceWorker"
in navigator
){

window
.addEventListener(
"load",
()=>{

navigator
.serviceWorker
.register(
"./service-worker.js"
)
.then(()=>{

console.log(
"SW Registered"
);

})
.catch(
console.error
);

}
);

}

console.log(
"Contact Angle Analyzer Ready"
);

</script>

</body>
</html>
